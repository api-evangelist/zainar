aid: zainar
name: ZaiNar
description: 'ZaiNar is a Positioning, Navigation and Timing (PNT) company that turns
  existing wireless networks into a sensing system. Its patented digital signal processing
  achieves sub-nanosecond time synchronization across commodity radios, which yields
  sub-meter 3D positioning for any device that emits a radio signal — indoors, outdoors,
  through walls and around corners — with no reliance on GPS/GNSS, cameras or additional
  device power. ZaiNar works across frequencies and known wireless protocols (Wi-Fi,
  5G/SRS, IoT radios) and is deployed today in healthcare equipment tracking, construction
  site and safety-zone monitoring, and coordinated autonomous operations. The company
  emerged from nine years of stealth in February 2026 with more than $100M raised and
  a $1B+ valuation, and opened a Tokyo office in April 2026. Location data is delivered
  to customers through a private, credential-gated REST and real-time WebSocket platform;
  ZaiNar publishes no public developer portal, OpenAPI definition or SDKs as of this
  profiling pass.'
