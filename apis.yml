apis:
- name: ZaiNar Location Platform API
  description: 'Private, credential-gated REST API for the ZaiNar Wi-Fi location cloud.
    Clients authenticate with a username/password to obtain a bearer token, then trigger
    and manage locates against tracker and anchor nodes (e.g. POST nodes/{system_id}/action).
    Resulting location measurements are delivered over a real-time WebSocket event
    stream rather than in the REST response. The surface is documented publicly only
    through ZaiNar''s own open-source latency measurement tool; there is no public
    developer portal, OpenAPI definition or reference documentation.'
